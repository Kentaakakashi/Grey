# Grey is a pre-exported static Framer website; do not run npm/Next.js builds.
[build]
  command = "echo 'Static Framer export: no build step required'"
  publish = "."

[build.processing]
  skip_processing = true

[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
