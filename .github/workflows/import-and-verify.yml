name: Import designer portfolio and verify Netlify build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-designer-portfolio
  cancel-in-progress: false

jobs:
  import-build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Grey
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Import upstream template files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/pawan-joshee/portfolio-website-for-graphic-designers.git /tmp/graphic-portfolio
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/graphic-portfolio/ ./
          # Ensure the Netlify deployment configuration remains at the repository root.
          cat > netlify.toml <<'EOF'
          [build]
            command = "npm ci && npm run build"
            publish = "out"

          [build.environment]
            NODE_VERSION = "20"
          EOF
          printf '20\n' > .nvmrc
          # Next.js is already configured for static export in next.config.ts.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!p.scripts||!p.scripts.build)throw new Error('Missing build script');console.log('Build script:',p.scripts.build)"

      - name: Install dependencies
        run: npm ci

      - name: Build static site for Netlify
        run: npm run build

      - name: Verify static export
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -d out/_next
          echo "Static export verified: out/index.html and out/_next exist."

      - name: Commit imported source and Netlify configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import graphic designer portfolio and configure Netlify"
            git push origin HEAD:main
          fi
